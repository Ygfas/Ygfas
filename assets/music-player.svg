<svg width="100%" viewBox="0 0 920 170" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="mus-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000" stroke-width="0.8" opacity="0.08"/>
    </pattern>
    <style>
      .reel-spin {
        transform-origin: center;
        animation: spinTape 3.5s linear infinite;
      }
      .cursor-pulse {
        animation: pulse 1s infinite alternate;
      }
      @keyframes spinTape {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="920" height="170" fill="#FFFDF5"/>
  <rect width="920" height="170" fill="url(#mus-grid)"/>

  <!-- Outer Hard Shadow -->
  <rect x="26" y="18" width="868" height="136" fill="#000"/>
  <!-- Main Deck (Electric Blue & Neo Brutalism) -->
  <rect x="20" y="12" width="868" height="136" fill="#4D96FF" stroke="#000" stroke-width="4"/>

  <!-- Left Side: Vintage Cassette Reel Unit -->
  <g transform="translate(42, 26)">
    <!-- Cassette Body Shadow -->
    <rect x="4" y="4" width="240" height="108" fill="#000"/>
    <rect x="0" y="0" width="240" height="108" fill="#FFE600" stroke="#000" stroke-width="3"/>
    
    <!-- Cassette Center Window -->
    <rect x="25" y="24" width="190" height="60" fill="#FFFDF5" stroke="#000" stroke-width="2.5"/>
    <rect x="55" y="38" width="130" height="32" rx="16" fill="#000"/>

    <!-- Left Tape Reel Gear -->
    <g transform="translate(85, 54)">
      <circle cx="0" cy="0" r="14" fill="#FFE600" stroke="#FFF" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#000" stroke-width="2.5"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#000" stroke-width="2.5"/>
        <line x1="-8" y1="-8" x2="8" y2="8" stroke="#000" stroke-width="2.5"/>
        <line x1="-8" y1="8" x2="8" y2="-8" stroke="#000" stroke-width="2.5"/>
      </g>
      <circle cx="0" cy="0" r="4.5" fill="#FFFDF5" stroke="#000" stroke-width="1.5"/>
    </g>

    <!-- Right Tape Reel Gear -->
    <g transform="translate(155, 54)">
      <circle cx="0" cy="0" r="14" fill="#FFE600" stroke="#FFF" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#000" stroke-width="2.5"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#000" stroke-width="2.5"/>
        <line x1="-8" y1="-8" x2="8" y2="8" stroke="#000" stroke-width="2.5"/>
        <line x1="-8" y1="8" x2="8" y2="-8" stroke="#000" stroke-width="2.5"/>
      </g>
      <circle cx="0" cy="0" r="4.5" fill="#FFFDF5" stroke="#000" stroke-width="1.5"/>
    </g>

    <!-- Top Label -->
    <text x="120" y="17" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#000" letter-spacing="1">
      SIDE A // ANIME LO-FI CHILL
    </text>
  </g>

  <!-- Right Side: Audio Track Info & Spectrum Visualizer -->
  <g transform="translate(310, 26)">
    <!-- Info Panel Shadow -->
    <rect x="4" y="4" width="558" height="108" fill="#000"/>
    <rect x="0" y="0" width="558" height="108" fill="#FFFDF5" stroke="#000" stroke-width="3"/>

    <!-- Status Header with Blinking On-Air Pill -->
    <g transform="translate(18, 20)">
      <rect x="0" y="-3" width="76" height="18" fill="#FF2A85" stroke="#000" stroke-width="1.5"/>
      <text x="38" y="10" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" font-weight="900" fill="#FFFDF5" letter-spacing="1">
        ● LIVE STREAM
      </text>
      <text x="90" y="11" font-family="'Space Mono', monospace" font-size="11" font-weight="800" fill="#777">
        ANIME OST &amp; SYNTHWAVE SESSION
      </text>
      <text x="522" y="11" text-anchor="end" font-family="'Space Mono', monospace" font-size="11" font-weight="900" fill="#23A094">
        03:24 / 04:58
      </text>
    </g>

    <!-- Track Title -->
    <g transform="translate(18, 50)">
      <text x="0" y="0" font-size="16" font-weight="900" fill="#000" letter-spacing="0.5">
        ♫ RADWIMPS - Sparkle [スパークル] <tspan font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FF2A85">(Your Name OST)</tspan>
      </text>
    </g>

    <!-- Progress Scrubber Bar -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="370" height="7" fill="#E2DDD0" stroke="#000" stroke-width="1.5"/>
      <rect x="0" y="0" width="245" height="7" fill="#FF2A85"/>
      <circle cx="245" cy="3.5" r="5.5" fill="#FFE600" stroke="#000" stroke-width="2"/>
    </g>

    <!-- Animated Equalizer Spectrum Bars (12 jumping bars) -->
    <g transform="translate(415, 84)">
      <!-- Bar 1 -->
      <rect x="0" y="-2" width="6" height="16" fill="#000" transform="scale(1,-1)">
        <animate attributeName="height" values="8;24;14;30;12;22;8" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="9" y="-2" width="6" height="24" fill="#FF2A85" transform="scale(1,-1)">
        <animate attributeName="height" values="24;12;32;18;28;10;24" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="18" y="-2" width="6" height="18" fill="#FFE600" transform="scale(1,-1)">
        <animate attributeName="height" values="16;30;10;26;14;32;16" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="27" y="-2" width="6" height="28" fill="#23A094" transform="scale(1,-1)">
        <animate attributeName="height" values="26;14;20;32;16;24;26" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="36" y="-2" width="6" height="14" fill="#000" transform="scale(1,-1)">
        <animate attributeName="height" values="14;28;18;8;22;30;14" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 6 -->
      <rect x="45" y="-2" width="6" height="30" fill="#FF2A85" transform="scale(1,-1)">
        <animate attributeName="height" values="30;16;28;14;32;18;30" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 7 -->
      <rect x="54" y="-2" width="6" height="18" fill="#FFE600" transform="scale(1,-1)">
        <animate attributeName="height" values="18;32;12;26;20;14;18" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 8 -->
      <rect x="63" y="-2" width="6" height="26" fill="#23A094" transform="scale(1,-1)">
        <animate attributeName="height" values="26;10;22;32;14;28;26" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 9 -->
      <rect x="72" y="-2" width="6" height="14" fill="#000" transform="scale(1,-1)">
        <animate attributeName="height" values="12;24;16;28;10;30;12" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 10 -->
      <rect x="81" y="-2" width="6" height="22" fill="#FF2A85" transform="scale(1,-1)">
        <animate attributeName="height" values="22;14;30;18;26;12;22" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 11 -->
      <rect x="90" y="-2" width="6" height="16" fill="#FFE600" transform="scale(1,-1)">
        <animate attributeName="height" values="16;28;12;32;18;22;16" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 12 -->
      <rect x="99" y="-2" width="6" height="26" fill="#23A094" transform="scale(1,-1)">
        <animate attributeName="height" values="24;16;30;12;28;18;24" dur="1.35s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Neobrutalist Mini Control Buttons -->
    <g transform="translate(18, 78)">
      <rect x="0" y="0" width="56" height="20" fill="#000"/>
      <text x="28" y="14" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#FFE600">◀◀ REW</text>
      
      <rect x="64" y="0" width="56" height="20" fill="#000"/>
      <text x="92" y="14" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#00F5A0">❚❚ PAUSE</text>
      
      <rect x="128" y="0" width="56" height="20" fill="#000"/>
      <text x="156" y="14" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#FFE600">FWD ▶▶</text>

      <rect x="192" y="0" width="90" height="20" fill="#FF2A85" stroke="#000" stroke-width="1.5"/>
      <text x="237" y="14" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9.5" font-weight="900" fill="#FFFDF5">🌸 ANIME LO-FI</text>
    </g>
  </g>
</svg>