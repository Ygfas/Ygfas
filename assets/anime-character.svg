<svg width="100%" viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="char-halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.3" fill="#000" opacity="0.10"/>
    </pattern>
    <pattern id="diag-stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#000" opacity="0.04"/>
    </pattern>
    <style>
      .blink-led {
        animation: blinkLed 1.2s infinite;
      }
      .hud-spin {
        transform-origin: center;
        animation: spinSlow 15s linear infinite;
      }
      .hud-spin-rev {
        transform-origin: center;
        animation: spinRev 10s linear infinite;
      }
      .float-orb {
        animation: floatOrb 3s ease-in-out infinite alternate;
      }
      @keyframes blinkLed {
        0%, 100% { fill: #00F5A0; filter: drop-shadow(0 0 2px #00F5A0); }
        50% { fill: #FF2A85; filter: drop-shadow(0 0 4px #FF2A85); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-6px) scale(1.05); }
      }
    </style>
  </defs>

  <!-- Neo-Brutalism Canvas Background -->
  <rect width="920" height="380" fill="#FFFDF5"/>
  <rect width="920" height="380" fill="url(#diag-stripes)"/>
  <rect width="920" height="380" fill="url(#char-halftone)"/>

  <!-- Outer Card Hard Shadow -->
  <rect x="28" y="24" width="864" height="332" fill="#000"/>
  <!-- Outer Card Base (Cyber Pink Rim) -->
  <rect x="20" y="16" width="864" height="332" fill="#FF90E8" stroke="#000" stroke-width="5"/>

  <!-- Inner Header Tab -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="320" height="28" fill="#000"/>
    <text x="16" y="19" font-family="'Space Mono', monospace" font-size="13" font-weight="900" fill="#FFE600" letter-spacing="2">
      CHARACTER HUD // キャラクターシート
    </text>
  </g>

  <g transform="translate(810, 32)">
    <circle cx="0" cy="14" r="7" fill="#000"/>
    <circle cx="0" cy="14" r="5" class="blink-led"/>
    <circle cx="20" cy="14" r="5" fill="#FFE600" stroke="#000" stroke-width="1.5"/>
    <circle cx="40" cy="14" r="5" fill="#4D96FF" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- ================= LEFT: ANIME CYBER HERO AVATAR ================= -->
  <g transform="translate(40, 72)">
    <!-- Avatar Box Drop Shadow -->
    <rect x="10" y="10" width="240" height="254" fill="#000"/>
    <!-- Avatar Box Container -->
    <rect x="0" y="0" width="240" height="254" fill="#FFE600" stroke="#000" stroke-width="4"/>

    <!-- Manga Speedline Accents inside Box -->
    <g stroke="#000" stroke-width="1.5" opacity="0.12">
      <line x1="0" y1="254" x2="240" y2="0"/>
      <line x1="40" y1="254" x2="240" y2="40"/>
      <line x1="0" y1="214" x2="200" y2="0"/>
    </g>

    <!-- Japanese Character Subtitle Overlay -->
    <text x="14" y="28" font-family="'Space Mono', monospace" font-size="11" font-weight="900" fill="#000" letter-spacing="1">
      STATUS: AWAKENED 覚醒
    </text>

    <!-- Anime Character Vector Portrait Art -->
    <g transform="translate(120, 150)">
      <!-- Cyber Aura Pulse Ring -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="6,4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="68" fill="#FFFDF5" stroke="#000" stroke-width="3"/>

      <!-- Manga Background Burst Lines inside circle -->
      <g stroke="#000" stroke-width="1" opacity="0.15">
        <line x1="-50" y1="-50" x2="50" y2="50"/>
        <line x1="50" y1="-50" x2="-50" y2="50"/>
        <line x1="0" y1="-65" x2="0" y2="65"/>
        <line x1="-65" y1="0" x2="65" y2="0"/>
      </g>

      <!-- Anime Jacket / Collar -->
      <path d="M -50 56 L -35 15 L 0 35 L 35 15 L 50 56 Z" fill="#000" stroke="#000" stroke-width="3"/>
      <path d="M -42 56 L -30 20 L 0 32 L 30 20 L 42 56 Z" fill="#4D96FF" stroke="#000" stroke-width="2"/>
      <polygon points="-8,32 0,44 8,32 0,22" fill="#FF2A85" stroke="#000" stroke-width="1.5"/>

      <!-- Anime Neck & Face -->
      <polygon points="-10,26 10,26 8,10 -8,10" fill="#FFE2C9" stroke="#000" stroke-width="1.5"/>
      <path d="M -30 -12 C -30 18 -15 32 0 32 C 15 32 30 18 30 -12 C 30 -35 -30 -35 -30 -12 Z" fill="#FFEFE0" stroke="#000" stroke-width="2.5"/>

      <!-- Anime Eyes (Neo-Cyber Anime Stylized) -->
      <!-- Left Eye -->
      <g transform="translate(-14, -6)">
        <ellipse cx="0" cy="0" rx="7" ry="9" fill="#000"/>
        <ellipse cx="0" cy="0" rx="5" ry="7" fill="#23A094"/>
        <circle cx="2" cy="-2" r="2.5" fill="#FFF"/>
        <circle cx="-1" cy="2" r="1.2" fill="#FFF"/>
        <path d="M -9 -7 Q -2 -12 7 -8" stroke="#000" stroke-width="2.5" fill="none"/>
      </g>
      <!-- Right Eye with Cybernetic Target Reticle -->
      <g transform="translate(14, -6)">
        <ellipse cx="0" cy="0" rx="7" ry="9" fill="#000"/>
        <ellipse cx="0" cy="0" rx="5" ry="7" fill="#FF2A85"/>
        <circle cx="-1" cy="-2" r="2.5" fill="#FFF"/>
        <circle cx="2" cy="2" r="1.2" fill="#FFF"/>
        <path d="M -7 -8 Q 2 -12 9 -7" stroke="#000" stroke-width="2.5" fill="none"/>
        <!-- Cyber Reticle HUD -->
        <circle cx="0" cy="0" r="11" fill="none" stroke="#FF2A85" stroke-width="1.2" stroke-dasharray="3,3">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Anime Nose & Cute Smirk -->
      <polygon points="0,2 2,5 0,6" fill="#D49B72"/>
      <path d="M -5 13 Q 0 17 6 12" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Anime Blush marks -->
      <g fill="#FF6B6B" opacity="0.6">
        <rect x="-24" y="3" width="7" height="2" transform="rotate(-15 -24 3)"/>
        <rect x="-20" y="7" width="7" height="2" transform="rotate(-15 -20 7)"/>
        <rect x="18" y="3" width="7" height="2" transform="rotate(15 18 3)"/>
        <rect x="14" y="7" width="7" height="2" transform="rotate(15 14 7)"/>
      </g>

      <!-- Anime Cyber Hair (Dramatic Spikes with Neon Highlights) -->
      <!-- Back hair spikes -->
      <path d="M -36 -10 L -52 -28 L -32 -26 L -44 -50 L -18 -40 L -25 -65 L 0 -48 L 25 -65 L 18 -40 L 44 -50 L 32 -26 L 52 -28 L 36 -10 Z" fill="#000" stroke="#000" stroke-width="3"/>
      <!-- Front bangs with Neon Edgerunner Cyan / Purple highlights -->
      <path d="M -30 -18 L -38 -2 L -24 -6 L -16 6 L -6 -8 L 8 4 L 14 -10 L 26 2 L 28 -18 Z" fill="#00F0FF" stroke="#000" stroke-width="2"/>
      <path d="M -22 -14 L -28 -2 L -18 -6 L -10 3 L -2 -8 L 6 2 L 12 -8 L 20 0 L 22 -14 Z" fill="#FFFDF5"/>

      <!-- Cyber Headset / Antigravity Audio Gear -->
      <g transform="translate(32, -4)">
        <rect x="0" y="-12" width="12" height="24" rx="4" fill="#000" stroke="#000" stroke-width="2"/>
        <rect x="2" y="-9" width="8" height="18" rx="2" fill="#FFE600"/>
        <circle cx="6" cy="0" r="3" fill="#FF2A85">
          <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
        </circle>
        <path d="M 6 -12 C 6 -32 -32 -38 -45 -34" fill="none" stroke="#000" stroke-width="3"/>
        <path d="M 6 -12 C 6 -32 -32 -38 -45 -34" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Bottom ID Tape inside Avatar Frame -->
    <rect x="0" y="214" width="240" height="40" fill="#000"/>
    <text x="120" y="238" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" font-weight="900" fill="#00F5A0" letter-spacing="2">
      ID: YGFAS_01
    </text>
  </g>

  <!-- ================= RIGHT: STATS & RPG ATTRIBUTES ================= -->
  <g transform="translate(310, 72)">
    <!-- White Card with Hard Shadow -->
    <rect x="8" y="8" width="564" height="254" fill="#000"/>
    <rect x="0" y="0" width="564" height="254" fill="#FFFDF5" stroke="#000" stroke-width="4"/>

    <!-- Header Line -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="8" height="20" fill="#FF2A85"/>
      <text x="16" y="16" font-size="18" font-weight="900" fill="#000" letter-spacing="1">
        YGFAS <tspan font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#777">[ワイジーファス]</tspan>
      </text>
      <rect x="360" y="-2" width="168" height="24" fill="#000"/>
      <text x="444" y="14" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" font-weight="900" fill="#00F5A0" letter-spacing="1.5">
        CLASS: WEB ARCHITECT
      </text>
    </g>

    <!-- Divider Bar -->
    <line x1="20" y1="52" x2="544" y2="52" stroke="#000" stroke-width="2"/>

    <!-- STAT BAR 1: UI/UX & Aesthetics -->
    <g transform="translate(20, 74)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" font-weight="800" fill="#000">
        [STAT: UI/UX &amp; DESIGN]
      </text>
      <text x="524" y="0" text-anchor="end" font-family="'Space Mono', monospace" font-size="12" font-weight="900" fill="#FF2A85">
        LVL.99 MAX
      </text>
      <!-- Meter Container -->
      <rect x="0" y="8" width="524" height="14" fill="#EAE5D9" stroke="#000" stroke-width="2"/>
      <rect x="0" y="8" width="510" height="14" fill="#FF2A85" stroke="#000" stroke-width="2">
        <animate attributeName="width" values="100;510" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- STAT BAR 2: React 19 & Next.js 15 Core -->
    <g transform="translate(20, 116)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" font-weight="800" fill="#000">
        [STAT: REACT 19 &amp; NEXT.JS 15]
      </text>
      <text x="524" y="0" text-anchor="end" font-family="'Space Mono', monospace" font-size="12" font-weight="900" fill="#23A094">
        LVL.96 CRIT
      </text>
      <!-- Meter Container -->
      <rect x="0" y="8" width="524" height="14" fill="#EAE5D9" stroke="#000" stroke-width="2"/>
      <rect x="0" y="8" width="490" height="14" fill="#23A094" stroke="#000" stroke-width="2">
        <animate attributeName="width" values="100;490" dur="1.8s" fill="freeze"/>
      </rect>
    </g>

    <!-- STAT BAR 3: Motion & 3D Web (Three.js/GSAP) -->
    <g transform="translate(20, 158)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" font-weight="800" fill="#000">
        [STAT: 3D DYNAMICS &amp; MOTION]
      </text>
      <text x="524" y="0" text-anchor="end" font-family="'Space Mono', monospace" font-size="12" font-weight="900" fill="#4D96FF">
        LVL.92 EXP
      </text>
      <!-- Meter Container -->
      <rect x="0" y="8" width="524" height="14" fill="#EAE5D9" stroke="#000" stroke-width="2"/>
      <rect x="0" y="8" width="460" height="14" fill="#4D96FF" stroke="#000" stroke-width="2">
        <animate attributeName="width" values="80;460" dur="2s" fill="freeze"/>
      </rect>
    </g>

    <!-- Badges Row at Bottom -->
    <g transform="translate(20, 202)">
      <!-- Badge 1: Violet Evergarden / Anime Insp -->
      <g>
        <rect x="2" y="2" width="250" height="28" fill="#000"/>
        <rect x="0" y="0" width="250" height="28" fill="#FFE600" stroke="#000" stroke-width="2"/>
        <text x="125" y="18" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" font-weight="800" fill="#000">
          🌸 INSP: VIOLET EVERGARDEN
        </text>
      </g>

      <!-- Badge 2: Edgerunner Code -->
      <g transform="translate(265, 0)">
        <rect x="2" y="2" width="258" height="28" fill="#000"/>
        <rect x="0" y="0" width="258" height="28" fill="#00F5A0" stroke="#000" stroke-width="2"/>
        <text x="129" y="18" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" font-weight="800" fill="#000">
          ⚡ CYBERPUNK EDGERUNNER MINDSET
        </text>
      </g>
    </g>
  </g>

  <!-- Interactive Anime Rotating Stars -->
  <g transform="translate(872, 340)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#FFE600" stroke="#000" stroke-width="2"/>
    </g>
  </g>

</svg>