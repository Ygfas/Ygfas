<svg width="100%" viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Neobrutalist Halftone Dot Matrix -->
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.5" fill="#000" opacity="0.12"/>
    </pattern>
    <!-- CRT Cyber Scanlines -->
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="8" y2="4" stroke="#000" stroke-width="1" opacity="0.04"/>
    </pattern>
    <!-- Isometric Anime Speed Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000" stroke-width="1" opacity="0.06"/>
    </pattern>
    
    <style>
      .glow-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite alternate;
      }
      .cursor-blink {
        animation: blink 0.9s infinite;
      }
      .shuriken-spin {
        transform-origin: center;
        animation: spin 12s linear infinite;
      }
      .shuriken-rev {
        transform-origin: center;
        animation: spinRev 8s linear infinite;
      }
      .float-badge {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); }
        100% { filter: drop-shadow(4px 4px 0px #FF2A85); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="920" height="360" fill="#FFFDF5"/>
  <rect width="920" height="360" fill="url(#grid)"/>
  <rect width="920" height="360" fill="url(#halftone)"/>
  <rect width="920" height="360" fill="url(#scan)"/>

  <!-- Manga Speedlines (Diagonal Dynamic Energy Lines) -->
  <g stroke="#000" stroke-width="2.5" opacity="0.08">
    <line x1="-80" y1="360" x2="160" y2="-60"/>
    <line x1="40" y1="360" x2="280" y2="-60"/>
    <line x1="160" y1="360" x2="400" y2="-60"/>
    <line x1="280" y1="360" x2="520" y2="-60"/>
    <line x1="620" y1="360" x2="860" y2="-60"/>
    <line x1="740" y1="360" x2="980" y2="-60"/>
    <line x1="840" y1="360" x2="1080" y2="-60"/>
  </g>

  <!-- Japanese Manga Background Accents -->
  <text x="35" y="44" font-size="20" font-weight="900" fill="#FF2A85" opacity="0.65" letter-spacing="4">フロントエンド // 領域展開</text>
  <text x="880" y="44" text-anchor="end" font-size="20" font-weight="900" fill="#23A094" opacity="0.65" letter-spacing="4">アニメ・サイバーコード</text>
  <text x="35" y="342" font-size="16" font-weight="900" fill="#4D96FF" opacity="0.6">コード × アート // YGFAS 2026</text>
  <text x="880" y="342" text-anchor="end" font-size="16" font-weight="900" fill="#FFDE00" stroke="#000" stroke-width="0.8" opacity="0.9">システム稼働中 [ONLINE]</text>

  <!-- TOP DECORATIVE HUD BAR -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="14" fill="#FF6B6B" stroke="#000" stroke-width="2.5"/>
    <rect x="22" y="0" width="14" height="14" fill="#FFDE00" stroke="#000" stroke-width="2.5"/>
    <rect x="44" y="0" width="14" height="14" fill="#23A094" stroke="#000" stroke-width="2.5"/>
  </g>

  <!-- MAIN NEOBRUTALISM HERO FRAME -->
  <!-- Hard Drop Shadow -->
  <rect x="42" y="70" width="844" height="236" fill="#000" rx="0"/>
  
  <!-- Main Foreground Card (Yellow Canvas) -->
  <rect x="34" y="62" width="844" height="236" fill="#FFDE00" stroke="#000" stroke-width="5" rx="0"/>

  <!-- Corner Comic Brackets / Neo-Brutalist Tabs -->
  <rect x="24" y="52" width="24" height="24" fill="#FF2A85" stroke="#000" stroke-width="3"/>
  <rect x="864" y="52" width="24" height="24" fill="#4D96FF" stroke="#000" stroke-width="3"/>
  <rect x="24" y="286" width="24" height="24" fill="#00F5A0" stroke="#000" stroke-width="3"/>
  <rect x="864" y="286" width="24" height="24" fill="#FF90E8" stroke="#000" stroke-width="3"/>

  <!-- Left Inner Panel: Hero Title & Anime Cyber Badge -->
  <g transform="translate(65, 85)">
    <!-- Japanese Mini Kicker -->
    <rect x="0" y="0" width="140" height="24" fill="#000"/>
    <text x="70" y="16" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" font-weight="900" fill="#FFFDF5" letter-spacing="2">「超・創造」</text>

    <!-- BIG NEOBRUTALIST NAME WITH 3D SHADOW OFFSET -->
    <g transform="translate(0, 84)">
      <!-- Hard Shadow Behind Text -->
      <text x="6" y="6" font-size="82" font-weight="900" fill="#FF2A85" letter-spacing="-2">YGFAS</text>
      <text x="0" y="0" font-size="82" font-weight="900" fill="#000" letter-spacing="-2">YGFAS</text>
    </g>

    <!-- Underline Stride Accent -->
    <rect x="0" y="104" width="370" height="9" fill="#000"/>
    <rect x="0" y="104" width="150" height="9" fill="#FF2A85"/>
    <rect x="150" y="104" width="70" height="9" fill="#4D96FF"/>

    <!-- Anime Status Pill -->
    <g transform="translate(0, 126)">
      <!-- Shadow -->
      <rect x="3" y="3" width="370" height="34" fill="#000"/>
      <!-- Pill -->
      <rect x="0" y="0" width="370" height="34" fill="#FFFDF5" stroke="#000" stroke-width="3"/>
      
      <circle cx="20" cy="17" r="6" fill="#00F5A0" stroke="#000" stroke-width="2">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22" font-family="'Space Mono', monospace" font-size="12" font-weight="800" fill="#000" letter-spacing="1">OVERCLOCKED ARCHITECT // 覚醒</text>
    </g>

    <!-- Subtitle Quotes / Role -->
    <g transform="translate(0, 175)">
      <text x="0" y="14" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#000" letter-spacing="1.5">
        &gt; BUILDING THE ANIME &amp; WEB CANVAS FUTURE
      </text>
    </g>
  </g>

  <!-- Right Inner Panel: Cyber Terminal & Stack HUD -->
  <g transform="translate(475, 85)">
    <!-- Pill 1: Main Role Badge (Hard Shadow + White on Black) -->
    <g>
      <rect x="4" y="4" width="375" height="36" fill="#000"/>
      <rect x="0" y="0" width="375" height="36" fill="#000" stroke="#000" stroke-width="3"/>
      <rect x="0" y="0" width="10" height="36" fill="#FF2A85"/>
      <text x="25" y="23" font-family="'Space Mono', monospace" font-size="14" font-weight="800" fill="#FFDE00" letter-spacing="2">FRONTEND &amp; CREATIVE ENGINEER</text>
    </g>

    <!-- Pill 2: Main Weapon Stack (Pink Background) -->
    <g transform="translate(0, 48)">
      <rect x="4" y="4" width="375" height="36" fill="#000"/>
      <rect x="0" y="0" width="375" height="36" fill="#FF90E8" stroke="#000" stroke-width="3"/>
      <rect x="0" y="0" width="10" height="36" fill="#000"/>
      <text x="25" y="23" font-family="'Space Mono', monospace" font-size="13" font-weight="800" fill="#000" letter-spacing="1.5">⚡ NEXT.JS 15 • REACT 19 • TS</text>
    </g>

    <!-- Pill 3: Visual & Motion Stack (Teal Background) -->
    <g transform="translate(0, 96)">
      <rect x="4" y="4" width="375" height="36" fill="#000"/>
      <rect x="0" y="0" width="375" height="36" fill="#23A094" stroke="#000" stroke-width="3"/>
      <rect x="0" y="0" width="10" height="36" fill="#000"/>
      <text x="25" y="23" font-family="'Space Mono', monospace" font-size="13" font-weight="800" fill="#FFFDF5" letter-spacing="1.5">✨ TAILWIND • THREE.JS • MOTION</text>
    </g>

    <!-- Pill 4: Code with Passion with Blinking Cursor -->
    <g transform="translate(0, 144)">
      <rect x="4" y="4" width="375" height="36" fill="#000"/>
      <rect x="0" y="0" width="375" height="36" fill="#FFFDF5" stroke="#000" stroke-width="3"/>
      <rect x="0" y="0" width="10" height="36" fill="#4D96FF"/>
      <text x="25" y="23" font-family="'Space Mono', monospace" font-size="13" font-weight="800" fill="#000" letter-spacing="1.5">🎯 CODE WITH PASSION &amp; SPIRIT</text>
      <!-- Blinking Rect Cursor -->
      <rect x="335" y="10" width="8" height="17" fill="#FF2A85" class="cursor-blink"/>
    </g>
  </g>

  <!-- INTERACTIVE ANIME ROTATING STARS / SHURIKEN (SVG SMIL ANIMATION) -->
  <!-- Top Right Star -->
  <g transform="translate(825, 48)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="#FF2A85" stroke="#000" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#FFFDF5" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Bottom Left Star -->
  <g transform="translate(75, 312)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#00F5A0" stroke="#000" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="2.5" fill="#000"/>
    </g>
  </g>

  <!-- Cyber Badge: Year 2026 / Edgerunner Style -->
  <g transform="translate(738, 282)">
    <rect x="4" y="4" width="100" height="28" fill="#000"/>
    <rect x="0" y="0" width="100" height="28" fill="#FF6B6B" stroke="#000" stroke-width="3"/>
    <text x="50" y="19" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" font-weight="900" fill="#000" letter-spacing="2">VER.2026</text>
  </g>

</svg>