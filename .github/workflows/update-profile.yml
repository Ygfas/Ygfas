name: 🌸 Update Profile README

on:
  schedule:
    - cron: '0 6 * * *'  # Berjalan otomatis tiap jam 06:00 UTC
  workflow_dispatch:      # Tombol pemicu manual

permissions:
  contents: write

jobs:
  generate-snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ygfas
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & Push snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if ! git diff --staged --quiet; then
            git commit -m "🌸 Update snake animation $(date '+%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

  refresh-stats:
    name: Refresh GitHub Stats Cache
    runs-on: ubuntu-latest
    steps:
      - name: Ping stats cache
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Ygfas" > /dev/null
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Ygfas" > /dev/null
          curl -s "https://github-readme-streak-stats.herokuapp.com/?user=Ygfas" > /dev/null
          echo "Stats cache refreshed"
