name: 🌸 Update Profile & Dynamic Assets

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  generate-assets:
    name: Generate Dynamic Neo-Brutalism Anime Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic SVGs (Stats, Languages, Activity Radar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_assets.py

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ygfas
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & Push Updated Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/ dist/
          if ! git diff --staged --quiet; then
            git commit -m "🌸 Auto-update dynamic anime stats & snake animation $(date '+%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
